name: Apply packet kind API migration

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jingle/packet-kind
          fetch-depth: 0
      - name: Migrate RTP packet API away from transport offsets
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} matches, got {found}")
              p.write_text(text.replace(old, new))

          replace(
              'psimedia/psimedia.h',
              '''class RtpPacket {\npublic:\n    RtpPacket();\n    RtpPacket(const QByteArray &rawValue, int portOffset);\n''',
              '''class RtpPacket {\npublic:\n    enum class Type { Rtp, Rtcp };\n\n    RtpPacket();\n    RtpPacket(const QByteArray &rawValue, Type type);\n''')
          replace(
              'psimedia/psimedia.h',
              '''    QByteArray rawValue() const;\n    int        portOffset() const;\n''',
              '''    QByteArray rawValue() const;\n    Type       type() const;\n''')

          replace(
              'psimedia/psimediaprovider.h',
              '''class PRtpPacket {\npublic:\n    QByteArray rawValue;\n    int        portOffset;\n\n    inline PRtpPacket() : portOffset(0) { }\n};\n''',
              '''class PRtpPacket {\npublic:\n    enum class Type { Rtp, Rtcp };\n\n    QByteArray rawValue;\n    Type       type = Type::Rtp;\n};\n''')

          replace(
              'psimedia/psimedia.cpp',
              '''    QByteArray rawValue;\n    int        portOffset;\n\n    Private(const QByteArray &_rawValue, int _portOffset) : rawValue(_rawValue), portOffset(_portOffset) { }\n''',
              '''    QByteArray rawValue;\n    Type       type;\n\n    Private(const QByteArray &_rawValue, Type _type) : rawValue(_rawValue), type(_type) { }\n''')
          replace(
              'psimedia/psimedia.cpp',
              '''RtpPacket::RtpPacket(const QByteArray &rawValue, int portOffset) : d(new Private(rawValue, portOffset)) { }\n''',
              '''RtpPacket::RtpPacket(const QByteArray &rawValue, Type type) : d(new Private(rawValue, type)) { }\n''')
          replace(
              'psimedia/psimedia.cpp',
              '''int RtpPacket::portOffset() const { return d->portOffset; }\n''',
              '''RtpPacket::Type RtpPacket::type() const { return d->type; }\n''')
          replace(
              'psimedia/psimedia.cpp',
              '''        return RtpPacket(pp.rawValue, pp.portOffset);\n''',
              '''        return RtpPacket(pp.rawValue, pp.type == PRtpPacket::Type::Rtp ? RtpPacket::Type::Rtp : RtpPacket::Type::Rtcp);\n''')
          replace(
              'psimedia/psimedia.cpp',
              '''        pp.rawValue   = rtp.rawValue();\n        pp.portOffset = rtp.portOffset();\n''',
              '''        pp.rawValue = rtp.rawValue();\n        pp.type     = rtp.type() == RtpPacket::Type::Rtp ? PRtpPacket::Type::Rtp : PRtpPacket::Type::Rtcp;\n''')

          replace(
              'gstprovider/rtpworker.cpp',
              'packet.portOffset == 0',
              'packet.type == PRtpPacket::Type::Rtp',
              count=2)
          replace(
              'gstprovider/rtpworker.cpp',
              '''    packet.rawValue   = ba;\n    packet.portOffset = 0;\n''',
              '''    packet.rawValue = ba;\n    packet.type     = PRtpPacket::Type::Rtp;\n''',
              count=2)

          p = Path('demo/main.cpp')
          text = p.read_text()
          text = text.replace('int                 offset = packet.portOffset();',
                              'int                 offset = packet.type() == PsiMedia::RtpPacket::Type::Rtp ? 0 : 1;')
          text = text.replace('PsiMedia::RtpPacket packet(rawValue, offset);',
                              'PsiMedia::RtpPacket packet(rawValue, offset == 0 ? PsiMedia::RtpPacket::Type::Rtp\n                                                             : PsiMedia::RtpPacket::Type::Rtcp);')
          if 'portOffset' in text:
              raise SystemExit('demo/main.cpp: transport-offset API remains')
          p.write_text(text)

          for path in ['psimedia/psimedia.h', 'psimedia/psimedia.cpp', 'psimedia/psimediaprovider.h',
                       'gstprovider/rtpworker.cpp']:
              if 'portOffset' in Path(path).read_text():
                  raise SystemExit(f'{path}: portOffset remains')
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psimedia/psimedia.h psimedia/psimedia.cpp psimedia/psimediaprovider.h gstprovider/rtpworker.cpp demo/main.cpp
          git diff --cached --check
          git commit -m "Model RTP packet kind independently of transport"
          git push origin HEAD:jingle/packet-kind

name: Windows MSVC

on:
  workflow_call:
    inputs:
      psi_ref:
        type: string
        default: ''
      build_profile:
        description: modern or win7
        type: string
        default: modern

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.build_profile == 'win7' && 'Qt5 / Win7' || 'Qt6' }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BUILD_PROFILE: ${{ inputs.build_profile }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve dependency lock
        id: dependencies
        uses: ./.github/actions/load-dependencies
        with:
          profile: ${{ inputs.build_profile }}
          psi-ref: ${{ inputs.psi_ref }}
      - name: Checkout matching Psi plugin API
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.dependencies.outputs.psi_repository }}
          ref: ${{ steps.dependencies.outputs.psi_ref }}
          path: _psi
          fetch-depth: 1
      - name: Verify locked Psi API checkout
        shell: bash
        run: python .github/scripts/resolve-dependencies.py --verify-psi-dir _psi
      - name: Install matching Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          cache: true
      - name: Set up Visual Studio compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ env.MSVC_TOOLSET }}
      - name: Set up compiler cache
        if: inputs.build_profile == 'modern'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: psimedia-windows-msvc-modern-qt${{ env.QT_VERSION }}-gst${{ env.GSTREAMER_VERSION }}
          max-size: 500M
          variant: ccache
      - name: Restore verified GStreamer installers
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gstreamer-installers/${{ inputs.build_profile }}
          key: psimedia-gstreamer-msvc-${{ steps.dependencies.outputs.gstreamer_cache_key }}
      - name: Install pinned GStreamer runtime and SDK
        id: install-gstreamer
        timeout-minutes: 20
        shell: pwsh
        run: |
          ./ci/windows/install-gstreamer.ps1 -BuildProfile $env:BUILD_PROFILE `
            -Root "$env:RUNNER_TEMP/gstreamer-$env:BUILD_PROFILE" `
            -CacheDirectory "$env:RUNNER_TEMP/gstreamer-installers/$env:BUILD_PROFILE"
      - name: Save verified GStreamer installers
        if: ${{ !cancelled() && steps.install-gstreamer.outputs.installers_verified == 'true' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/gstreamer-installers/${{ inputs.build_profile }}
          key: psimedia-gstreamer-msvc-${{ steps.dependencies.outputs.gstreamer_cache_key }}
      - name: Build and test native media plugin
        shell: pwsh
        run: |
          ./ci/windows/build-msvc.ps1 -BuildProfile $env:BUILD_PROFILE `
            -GStreamerVersion $env:GSTREAMER_VERSION -QtMajor $env:QT_MAJOR `
            -UseCcache:($env:BUILD_PROFILE -eq 'modern')
      - uses: actions/upload-artifact@v4
        with:
          name: psimedia-windows-msvc-${{ inputs.build_profile }}
          path: |
            stage-msvc-${{ inputs.build_profile }}/
            plugin-dependencies-${{ inputs.build_profile }}.txt

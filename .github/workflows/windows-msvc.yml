name: Windows MSVC

on:
  workflow_call:
    inputs:
      psi_ref:
        type: string
        required: true
      build_profile:
        description: modern or win7
        type: string
        default: modern

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.build_profile == 'win7' && 'Qt5 / Win7' || 'Qt6' }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BUILD_PROFILE: ${{ inputs.build_profile }}
      QT_MAJOR: ${{ inputs.build_profile == 'win7' && '5' || '6' }}
      QT_VERSION: ${{ inputs.build_profile == 'win7' && '5.15.2' || '6.8.3' }}
      GSTREAMER_VERSION: ${{ inputs.build_profile == 'win7' && '1.24.13' || '1.28.7' }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout matching Psi plugin API
        uses: actions/checkout@v4
        with:
          repository: psi-im/psi
          ref: ${{ inputs.psi_ref }}
          path: _psi
          fetch-depth: 1
      - name: Install matching Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ inputs.build_profile == 'win7' && 'win64_msvc2019_64' || 'win64_msvc2022_64' }}
          cache: true
      - name: Set up Visual Studio compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ inputs.build_profile == 'win7' && '14.29' || '' }}
      - name: Set up compiler cache
        if: inputs.build_profile == 'modern'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: psimedia-windows-msvc-modern-qt${{ env.QT_VERSION }}-gst${{ env.GSTREAMER_VERSION }}
          max-size: 500M
          variant: ccache
      # Mirror QCA's Windows vcpkg OpenSSL cache strategy. The cache is
      # repository-scoped; QCA's cache itself cannot be restored by PsiMedia.
      - name: Resolve Windows vcpkg cache key
        if: inputs.build_profile == 'modern'
        id: vcpkg-cache-key
        shell: pwsh
        run: |
          $vcpkgRevision = (git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve vcpkg revision' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $toolsetFile = Join-Path $vsPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'
          $toolset = (Get-Content $toolsetFile -Raw).Trim()
          "vcpkg=$vcpkgRevision" >> $env:GITHUB_OUTPUT
          "msvc=$toolset" >> $env:GITHUB_OUTPUT

      - name: Restore Windows vcpkg binary cache
        if: inputs.build_profile == 'modern'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: psimedia-vcpkg-openssl-${{ runner.os }}-${{ steps.vcpkg-cache-key.outputs.vcpkg }}-${{ steps.vcpkg-cache-key.outputs.msvc }}-x64-windows-release-v1

      - name: Install pinned GStreamer runtime and SDK
        shell: pwsh
        run: |
          ./ci/windows/install-gstreamer.ps1 -Version $env:GSTREAMER_VERSION `
            -Root "$env:RUNNER_TEMP/gstreamer-$env:BUILD_PROFILE"
      - name: Build and test native media plugin
        shell: pwsh
        run: |
          ./ci/windows/build-msvc.ps1 -BuildProfile $env:BUILD_PROFILE `
            -GStreamerVersion $env:GSTREAMER_VERSION -QtMajor $env:QT_MAJOR `
            -UseCcache:($env:BUILD_PROFILE -eq 'modern')
      - uses: actions/upload-artifact@v4
        with:
          name: psimedia-windows-msvc-${{ inputs.build_profile }}
          path: |
            stage-msvc-${{ inputs.build_profile }}/
            plugin-dependencies-${{ inputs.build_profile }}.txt

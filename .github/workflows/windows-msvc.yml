name: Windows MSVC

on:
  workflow_call:
    inputs:
      psi_ref:
        type: string
        default: ''
      build_profile:
        description: modern or win7
        type: string
        default: modern
      source_ref:
        description: Optional exact tagged source revision
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.build_profile == 'win7' && 'Windows 7 x64 (Qt 5, MSVC)' || 'Windows x64 (Qt 6, MSVC)' }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BUILD_PROFILE: ${{ inputs.build_profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Resolve dependency lock
        id: dependencies
        uses: ./.github/actions/load-dependencies
        with:
          profile: ${{ inputs.build_profile }}
          psi-ref: ${{ inputs.psi_ref }}
      - name: Checkout matching Psi plugin API
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.dependencies.outputs.psi_repository }}
          ref: ${{ steps.dependencies.outputs.psi_ref }}
          path: _psi
          fetch-depth: 1
      - name: Verify locked Psi API checkout
        shell: bash
        run: python .github/scripts/resolve-dependencies.py --verify-psi-dir _psi
      - name: Install matching Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          cache: true
      - name: Set up Visual Studio compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ env.MSVC_TOOLSET }}
      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: psimedia-windows-msvc-${{ inputs.build_profile }}-qt${{ env.QT_VERSION }}-gst${{ env.GSTREAMER_VERSION }}
          max-size: 500M
          variant: ccache
      # Mirror QCA's Windows vcpkg OpenSSL cache strategy for both profiles: the
      # Win7 profile otherwise rebuilds OpenSSL and libSRTP with v142 every run.
      # The cache is repository-scoped; QCA's cache cannot be restored here.
      - name: Resolve Windows vcpkg cache key
        id: vcpkg-cache-key
        shell: pwsh
        run: |
          $vcpkgRevision = (git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve vcpkg revision' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $toolsetFile = Join-Path $vsPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'
          $toolset = if ($env:MSVC_TOOLSET) { $env:MSVC_TOOLSET } else { (Get-Content $toolsetFile -Raw).Trim() }
          $triplet = if ($env:BUILD_PROFILE -eq 'win7') { 'x64-win7' } else { 'x64-windows-release' }
          "key=psimedia-vcpkg-openssl-${env:RUNNER_OS}-$vcpkgRevision-$toolset-$triplet-v1" >> $env:GITHUB_OUTPUT

      # Restore and save separately: the binaries built by vcpkg are kept even when a later check fails.
      - name: Restore Windows vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache-key.outputs.key }}

      - name: Restore verified GStreamer installers
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gstreamer-installers/${{ inputs.build_profile }}
          key: psimedia-gstreamer-msvc-${{ steps.dependencies.outputs.gstreamer_cache_key }}
      - name: Install pinned GStreamer runtime and SDK
        id: install-gstreamer
        timeout-minutes: 20
        shell: pwsh
        run: |
          ./ci/windows/install-gstreamer.ps1 -BuildProfile $env:BUILD_PROFILE `
            -Root "$env:RUNNER_TEMP/gstreamer-$env:BUILD_PROFILE" `
            -CacheDirectory "$env:RUNNER_TEMP/gstreamer-installers/$env:BUILD_PROFILE"
      - name: Save verified GStreamer installers
        if: ${{ !cancelled() && steps.install-gstreamer.outputs.installers_verified == 'true' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/gstreamer-installers/${{ inputs.build_profile }}
          key: psimedia-gstreamer-msvc-${{ steps.dependencies.outputs.gstreamer_cache_key }}
      - name: Build and test native media plugin
        shell: pwsh
        run: |
          ./ci/windows/build-msvc.ps1 -BuildProfile $env:BUILD_PROFILE `
            -GStreamerVersion $env:GSTREAMER_VERSION -QtMajor $env:QT_MAJOR `
            -UseCcache
      - name: Save Windows vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache-key.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: psimedia-windows-msvc-${{ inputs.build_profile }}
          path: |
            stage-msvc-${{ inputs.build_profile }}/
            plugin-dependencies-${{ inputs.build_profile }}.txt

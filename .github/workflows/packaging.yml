name: Windows packaging

on:
  workflow_dispatch:
    inputs:
      psi_ref:
        description: Matching Psi plugin API revision
        type: string
        default: caa631fd2b56d38a435b816cc6e4098dfe63c823

permissions:
  contents: read

concurrency:
  group: psimedia-windows-packaging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      psi_ref: ${{ inputs.psi_ref }}
      packaging: true

name: Windows packaging

on:
  workflow_dispatch:
    inputs:
      psi_ref:
        description: Optional Psi commit; must match dependencies.lock.json
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: psimedia-windows-packaging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      psi_ref: ${{ inputs.psi_ref }}
      packaging: true

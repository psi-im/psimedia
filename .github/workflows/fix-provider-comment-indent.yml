name: Fix provider comment indentation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jingle/provider-capabilities
      - shell: python
        run: |
          from pathlib import Path
          p = Path('gstprovider/gstthread.cpp')
          s = p.read_text()
          old = '\n// Echo cancellation is optional. The audio pipeline enables it when the\n'
          new = '\n        // Echo cancellation is optional. The audio pipeline enables it when the\n'
          if s.count(old) != 1:
              raise SystemExit('unexpected comment indentation state')
          p.write_text(s.replace(old, new))
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gstprovider/gstthread.cpp
          git diff --cached --check
          git commit -m "Fix provider capability comment formatting"
          git push origin HEAD:jingle/provider-capabilities

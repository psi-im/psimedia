name: Windows MSVC profiles

on:
  workflow_dispatch:
    inputs:
      psi_ref:
        description: Optional Psi commit; must match dependencies.lock.json
        type: string
        default: ''
  workflow_call:
    inputs:
      packaging:
        description: Include the legacy Windows 7 package profile
        type: boolean
        default: false
      psi_ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  msvc:
    name: Windows MSVC
    uses: ./.github/workflows/windows-msvc.yml
    with:
      psi_ref: ${{ inputs.psi_ref }}
      build_profile: modern

  win7-package:
    name: Windows 7 package
    if: inputs.packaging
    uses: ./.github/workflows/windows-msvc.yml
    with:
      psi_ref: ${{ inputs.psi_ref }}
      build_profile: win7

name: Windows media profiles

on:
  workflow_dispatch:
    inputs:
      psi_ref:
        description: Matching Psi plugin API revision
        type: string
        default: caa631fd2b56d38a435b816cc6e4098dfe63c823
  workflow_call:
    inputs:
      packaging:
        description: Include the legacy Windows 7 package profile
        type: boolean
        default: false
      psi_ref:
        type: string
        default: caa631fd2b56d38a435b816cc6e4098dfe63c823

permissions:
  contents: read

jobs:
  msys2:
    name: Modern MSYS2 / Qt5 / current GStreamer
    runs-on: windows-2022
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache/msys2
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
      - name: Checkout matching Psi plugin API
        uses: actions/checkout@v4
        with:
          repository: psi-im/psi
          ref: ${{ inputs.psi_ref }}
          path: _psi
          fetch-depth: 1
      - name: Install current MSYS2 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good
            mingw-w64-x86_64-gst-plugins-bad
            mingw-w64-x86_64-libsrtp
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: psimedia-ccache-msys2-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            psimedia-ccache-msys2-v1-
      - name: Configure compiler cache
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ccache --set-config=max_size=500M
          ccache --zero-stats
      - name: Verify installed media SDK
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -Q mingw-w64-x86_64-gstreamer mingw-w64-x86_64-gst-plugins-bad
          gst-inspect-1.0 --version
          gst-inspect-1.0 mfvideosrc
      - name: Build and test modern media plugin
        shell: msys2 {0}
        env:
          GSTREAMER_1_0_ROOT_X86_64: /mingw64
          QT_QPA_PLATFORM: offscreen
          GST_DEBUG_NO_COLOR: '1'
        run: |
          set -euo pipefail
          cmake -S . -B build-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/stage-msys2" \
            -DCMAKE_CXX_FLAGS='-D_WIN32_WINNT=0x0A00 -DWINVER=0x0A00' \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DQT_DEFAULT_MAJOR_VERSION=5 -DBUILD_DEMO=OFF -DBUILD_PSIPLUGIN=ON \
            -DPSIMEDIA_BUILD_TESTS=ON -DPSIMEDIA_ENABLE_SRTP=ON \
            -DPSIMEDIA_WINDOWS_VIDEO_SOURCE=mfvideosrc \
            -DPLUGINS_ROOT_DIR="$PWD/_psi/plugins"
          cmake --build build-windows --parallel 2
          ctest --test-dir build-windows --output-on-failure --no-tests=error -j1 \
            -R '^psimedia_(payloadinfo|opusrtppay|securertp|securertpgroup|securertpqueue)$'
          cmake --install build-windows
          plugin=$(find stage-msys2 -type f -iname '*mediaplugin.dll' -print -quit)
          test -n "$plugin"
          objdump -p "$plugin" | tee plugin-dependencies-msys2.txt
          grep -Eiq 'DLL Name: .*srtp.*\.dll' plugin-dependencies-msys2.txt
      - name: Compiler cache statistics
        if: always()
        shell: msys2 {0}
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: psimedia-windows-msys2-qt5
          path: |
            stage-msys2/
            plugin-dependencies-msys2.txt

  msvc:
    name: Modern MSVC
    uses: ./.github/workflows/windows-msvc.yml
    with:
      psi_ref: ${{ inputs.psi_ref }}
      build_profile: modern

  win7-package:
    name: Windows 7 package
    if: inputs.packaging
    uses: ./.github/workflows/windows-msvc.yml
    with:
      psi_ref: ${{ inputs.psi_ref }}
      build_profile: win7

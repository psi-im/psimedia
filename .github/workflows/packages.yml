name: PsiMedia packages

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact tag/ref to package
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing tag/ref to package (empty means current branch)
        type: string
        required: false
        default: ''
  push:
    branches: [master]
    paths:
      - '.github/workflows/packages.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/windows.yml'
      - '.github/workflows/windows-msvc.yml'
  pull_request:
    paths:
      - '.github/workflows/packages.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/windows.yml'
      - '.github/workflows/windows-msvc.yml'

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.release }} / Qt${{ matrix.qt_major }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            release: '24.04'
            qt_major: '5'
            qt_dev: qtbase5-dev
          - runner: ubuntu-24.04
            release: '24.04'
            qt_major: '6'
            qt_dev: qt6-base-dev
          - runner: ubuntu-26.04
            release: '26.04'
            qt_major: '6'
            qt_dev: qt6-base-dev
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Resolve dependency lock
        id: dependencies
        uses: ./.github/actions/load-dependencies
      - name: Checkout matching Psi plugin API
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.dependencies.outputs.psi_repository }}
          ref: ${{ steps.dependencies.outputs.psi_ref }}
          path: _psi
      - name: Verify locked Psi API
        run: python3 .github/scripts/resolve-dependencies.py --verify-psi-dir _psi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config dpkg-dev fakeroot file \
            ${{ matrix.qt_dev }} libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libsrtp2-dev
      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DQT_DEFAULT_MAJOR_VERSION=${{ matrix.qt_major }} \
            -DBUILD_DEMO=OFF -DBUILD_PSIPLUGIN=ON \
            -DPSIMEDIA_BUILD_TESTS=OFF -DPSIMEDIA_ENABLE_SRTP=ON \
            -DPSIMEDIA_BUILD_DEB_PACKAGE=ON \
            -DPLUGINS_ROOT_DIR="$GITHUB_WORKSPACE/_psi/plugins"
          cmake --build build-release --parallel 2
          mkdir -p artifacts
          cpack --config build-release/CPackConfig.cmake -G DEB -B artifacts
          pkg=$(find artifacts -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -s "$pkg"
          dpkg-deb -c "$pkg" | grep -E '/psi/plugins/.*mediaplugin'
          dpkg-deb -f "$pkg" Depends | grep -i srtp
          source_ref='${{ inputs.source_ref }}'
          if [[ -n "$source_ref" && "$source_ref" == v* ]]; then
            tag="$source_ref"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=""
          fi
          if [[ -n "$tag" ]]; then
            version=$(dpkg-deb -f "$pkg" Version)
            [[ "$version" == "${tag#v}" ]] || {
              echo "::error::Package version $version does not match tag $tag"
              exit 1
            }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: psimedia-deb-ubuntu-${{ matrix.release }}-qt${{ matrix.qt_major }}
          path: artifacts/*.deb
          if-no-files-found: error

  debian:
    name: Debian 13 / Qt6
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 90
    steps:
      - name: Bootstrap Debian toolchain
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 \
            cmake ninja-build build-essential pkg-config dpkg-dev fakeroot file \
            qt6-base-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libsrtp2-dev
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Resolve dependency lock
        id: dependencies
        uses: ./.github/actions/load-dependencies
      - name: Checkout matching Psi plugin API
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.dependencies.outputs.psi_repository }}
          ref: ${{ steps.dependencies.outputs.psi_ref }}
          path: _psi
      - name: Verify locked Psi API
        run: python3 .github/scripts/resolve-dependencies.py --verify-psi-dir _psi
      - name: Enable Git metadata for release versioning
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          # Checkout's safe.directory is temporary; Debian's container
          # has a different owner/UID. CMake invokes git describe to
          # determine the DEB version, so Git metadata must be readable.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD
          if [[ "$SOURCE_REF" == v* ]]; then
            actual=$(git -C "$GITHUB_WORKSPACE" describe --tags --exact-match --match 'v[0-9]*')
            if [[ "$actual" != "$SOURCE_REF" ]]; then
              echo "::error::Expected checked out tag $SOURCE_REF, got $actual"
              exit 1
            fi
          fi
      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DQT_DEFAULT_MAJOR_VERSION=6 \
            -DBUILD_DEMO=OFF -DBUILD_PSIPLUGIN=ON \
            -DPSIMEDIA_BUILD_TESTS=OFF -DPSIMEDIA_ENABLE_SRTP=ON \
            -DPSIMEDIA_BUILD_DEB_PACKAGE=ON \
            -DPLUGINS_ROOT_DIR="$GITHUB_WORKSPACE/_psi/plugins"
          cmake --build build-release --parallel 2
          mkdir -p artifacts
          cpack --config build-release/CPackConfig.cmake -G DEB -B artifacts
          pkg=$(find artifacts -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -s "$pkg"
          dpkg-deb -c "$pkg" | grep -E '/psi/plugins/.*mediaplugin'
          dpkg-deb -f "$pkg" Depends | grep -i srtp
          source_ref='${{ inputs.source_ref }}'
          if [[ -n "$source_ref" && "$source_ref" == v* ]]; then
            tag="$source_ref"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=""
          fi
          if [[ -n "$tag" ]]; then
            version=$(dpkg-deb -f "$pkg" Version)
            [[ "$version" == "${tag#v}" ]] || {
              echo "::error::Package version $version does not match tag $tag"
              exit 1
            }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: psimedia-deb-debian-13-qt6
          path: artifacts/*.deb
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.platform }} / Qt6
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: arm64
          - runner: macos-15-intel
            platform: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Resolve dependency lock
        id: dependencies
        uses: ./.github/actions/load-dependencies
      - name: Checkout matching Psi plugin API
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.dependencies.outputs.psi_repository }}
          ref: ${{ steps.dependencies.outputs.psi_ref }}
          path: _psi
      - name: Verify locked Psi API
        run: python3 .github/scripts/resolve-dependencies.py --verify-psi-dir _psi
      - name: Install Qt, GStreamer and libSRTP
        run: brew install cmake ninja qt gstreamer srtp pkgconf
      - name: Build and stage plugin
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdk" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DQT_DEFAULT_MAJOR_VERSION=6 \
            -DBUILD_DEMO=OFF -DBUILD_PSIPLUGIN=ON \
            -DPSIMEDIA_BUILD_TESTS=OFF -DPSIMEDIA_ENABLE_SRTP=ON \
            -DPLUGINS_ROOT_DIR="$GITHUB_WORKSPACE/_psi/plugins"
          cmake --build build-release --parallel 2
          cmake --install build-release
          plugin=$(find sdk -type f -name '*mediaplugin*.dylib' -print -quit)
          test -s "$plugin"
          otool -L "$plugin" | tee sdk/mediaplugin-dependencies.txt
          grep -i srtp sdk/mediaplugin-dependencies.txt
          mkdir -p sdk/share/licenses/psimedia
          cp COPYING sdk/share/licenses/psimedia/COPYING
      - uses: actions/upload-artifact@v4
        with:
          name: psimedia-qt6-macos-${{ matrix.platform }}
          path: sdk/
          if-no-files-found: error

  windows:
    name: Windows Qt6 + Qt5 Win7
    uses: ./.github/workflows/windows.yml
    with:
      packaging: true
      source_ref: ${{ inputs.source_ref }}

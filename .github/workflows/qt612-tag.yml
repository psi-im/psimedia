name: Tag PsiMedia after Qt6.12 release verification
on:
  push:
    branches: [release/qt-6.12-unification]
permissions:
  contents: write
  actions: read
jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for matching packages and regressions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 360); do
            success=0
            for workflow in packages.yml rtp-regressions.yml; do
              payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=30&head_sha=$GITHUB_SHA")
              state=$(jq -r --arg sha "$GITHUB_SHA" '
                [.workflow_runs[] | select(.head_sha == $sha and .event == "pull_request")]
                | sort_by(.created_at) | last | [.status, (.conclusion // "")] | @tsv
              ' <<< "$payload")
              if [[ "$state" == $'completed\tsuccess' ]]; then
                ((success+=1))
              elif [[ "$state" == completed$'\t'* ]]; then
                echo "::error::$workflow failed for $GITHUB_SHA: $state"; exit 1
              fi
            done
            [[ "$success" == 2 ]] && break
            if (( i == 360 )); then
              echo "::error::Timeout awaiting verified packages + regressions"; exit 1
            fi
            sleep 15
          done
      - name: Tag exact tested PsiMedia source
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.3
          git fetch origin release/qt-6.12-unification --no-tags
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag exists, refusing mutation"; exit 1
          fi
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git tag -a "$tag" "$GITHUB_SHA" -m 'PsiMedia 1.3 / Windows and macOS Qt 6.12.0'
          git push origin "refs/tags/$tag"

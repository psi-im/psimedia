name: Apply provider capability fix

on:
  push:
    branches:
      - jingle/provider-capabilities
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jingle/provider-capabilities
          fetch-depth: 0
      - name: Apply focused psimedia fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} match(es), got {count}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              "gstprovider/gstthread.cpp",
              '#ifndef Q_OS_WIN\n        reqelem << "webrtcechoprobe";\n#endif\n',
              '// Echo cancellation is optional. The audio pipeline enables it when the\n'
              '        // echo probe/DSP elements are available, but their absence must not make\n'
              '        // the whole media provider unusable.\n')

          replace(
              "gstprovider/devices.cpp",
              '        delete _platform;\n        gst_device_monitor_stop(_monitor);\n        g_object_unref(_monitor);',
              '        delete _platform;\n        if (_monitor) {\n            gst_device_monitor_stop(_monitor);\n'
              '            g_object_unref(_monitor);\n        }')

          replace(
              "gstprovider/rtpworker.cpp",
              '                opts.aec                   = true;\n'
              '                opts.echoProberName        = pd_audiosink->options().echoProberName;',
              '                opts.echoProberName        = pd_audiosink->options().echoProberName;\n'
              '                opts.aec                   = !opts.echoProberName.isEmpty();')

          replace(
              "gstprovider/pipeline.cpp",
              '            if (options.aec) {\n',
              '            bool aecAvailable = true;\n'
              '            if (options.aec) {\n'
              '                GstElementFactory *factory = gst_element_factory_find("webrtcdsp");\n'
              '                aecAvailable               = factory != nullptr;\n'
              '                if (factory)\n'
              '                    gst_object_unref(factory);\n'
              '                else\n'
              '                    qWarning("Failed to find GStreamer webrtcdsp element. Echo cancellation was disabled");\n'
              '            }\n\n'
              '            if (options.aec && aecAvailable) {\n')
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gstprovider/gstthread.cpp gstprovider/devices.cpp gstprovider/rtpworker.cpp gstprovider/pipeline.cpp
          git diff --cached --check
          git commit -m "Make echo cancellation an optional media capability"
          git push origin HEAD:jingle/provider-capabilities

name: Tag PsiMedia v1.2.1 and launch release
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tag-psimedia-v121-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create version tag at exact verified merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=3368f22642e374975f3c9e02c309ee8c2b53ee37
          actual="$(gh api "repos/$GITHUB_REPOSITORY/pulls/26" --jq .merge_commit_sha)"
          test "$actual" = "$target" || {
            echo "::error::PR 26 merge commit has changed"
            exit 1
          }
          git cat-file -e "$target^{commit}"
          git merge-base --is-ancestor "$target" HEAD
          git fetch --force --tags origin
          if git rev-parse -q --verify refs/tags/v1.2.1 >/dev/null; then
            test "$(git rev-list -n1 refs/tags/v1.2.1)" = "$target" || {
              echo "::error::v1.2.1 already exists at another revision"
              exit 1
            }
          else
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git tag -a v1.2.1 "$target" -m "PsiMedia 1.2.1: Qt 6.12 modern packages, Qt5 Win7 compatibility"
            git push origin refs/tags/v1.2.1:refs/tags/v1.2.1
          fi
          ref_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.1" --jq .object.type)"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.1" --jq .object.sha)"
          if [[ "$ref_type" == tag ]]; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .object.sha)"
          fi
          test "$tag_sha" = "$target"

      - name: Run existing release packaging workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master -f tag=v1.2.1
          echo "Started PsiMedia v1.2.1 release pipeline."
